# spz-core: the SPZ bot's inference stack, native. Extractor (pinned
# 825-feature v2 schema), value MLP + policy head, blend, dominance
# prunes, rollout playouts, determinized world sampling -- zero JSON in
# the hot loop (typed PlayerObservation end to end; JSON only at the
# K-per-decision world boundary). Python keeps SGD/ring/league logic
# and remains the lockstep reference implementation.
[package]
name = "spz-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "spz_core"
crate-type = ["cdylib", "rlib"]

[features]
# Per-phase ISMCTS timing (mcts::prof); off in production builds.
prof = []

[dependencies]
penta = { path = "../vendor/penta" }
serde_json = { version = "1", features = ["preserve_order"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py313"] }
# Thread-caching allocator. The native AAC runner allocates hard in its
# hot loop (a feature vector per candidate, a game clone per candidate),
# and glibc's arena locks serialize that across threads: measured 8.0 g/s
# from ONE process with 30 threads versus ~26 g/s aggregate from four
# processes with 8 threads each -- same machine, same work, so the wall
# was per-process allocator contention, not memory bandwidth.
mimalloc = { version = "0.1", default-features = false }

[profile.release]
lto = false  # LTO miscompiled the cdylib -> SIGKILL at dlopen; disabled
