[package]
name = "source-file-sizes"
version = "0.7.0"
edition = "2024"
description = "Repository-wide Rust source-file size limit, checked without building the engine"
publish = false

[lib]
path = "src/lib.rs"

# Deliberately empty. This check reads the working tree and nothing else, so
# it must not depend on `penta`: an integration test inside that package links
# the engine, which turned a filesystem walk into a multi-minute build in a
# fresh worktree and is why the check went unrun before pushes.
[dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = "warn"
