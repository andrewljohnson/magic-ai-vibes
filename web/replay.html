<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replay viewer</title>
<style>
  :root {
    --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --grid: #e7e6e2;
    --hl: #eda100;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --grid: #34332f;
      --hl: #c98500;
    }
  }
  html, body { margin: 0; background: var(--surface); color: var(--ink);
    font: 14px/1.45 -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--ink-2); font-size: 12.5px; margin: 0 0 12px; }
  .controls { display: flex; gap: 8px; align-items: center; margin: 0 0 12px; flex-wrap: wrap; }
  button { background: var(--grid); color: var(--ink); border: 0;
    border-radius: 7px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  select, input { background: var(--surface); color: var(--ink);
    border: 1px solid var(--grid); border-radius: 6px; padding: 5px 8px; }
  .msg { border-left: 3px solid var(--hl); padding: 6px 10px; margin: 10px 0;
    font-weight: 600; }
  .boards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 700px) { .boards { grid-template-columns: 1fr; } }
  .board { border: 1px solid var(--grid); border-radius: 10px; padding: 10px 12px; }
  .board h2 { font-size: 13px; margin: 0 0 6px; }
  .zone { font-size: 12.5px; margin: 4px 0; }
  .zone b { color: var(--ink-2); font-weight: 600; }
  .tapped { opacity: .5; }
  .sick { font-style: italic; }
  .card { display: inline-block; border: 1px solid var(--grid);
    border-radius: 5px; padding: 1px 6px; margin: 1px 2px; }
  .stack { border: 1px dashed var(--grid); border-radius: 8px;
    padding: 6px 10px; margin: 10px 0; font-size: 12.5px; }
</style>
</head>
<body>
<main>
  <h1>Replay viewer</h1>
  <p class="sub" id="meta">Pick a replay.</p>
  <div class="controls">
    <select id="game"></select>
    <button id="prev">&larr; Prev</button>
    <button id="next">Next &rarr;</button>
    <label>Jump to turn
      <input id="turn" type="number" min="1" style="width:4.5em"></label>
    <span class="sub" id="pos"></span>
  </div>
  <div class="msg" id="message">–</div>
  <div class="stack" id="stack" style="display:none"></div>
  <div class="boards">
    <div class="board" id="board0"></div>
    <div class="board" id="board1"></div>
  </div>
</main>
<script src="site-nav.js"></script>
<script>
let replay = null;
let step = 0;

function permanent(entry) {
  const classes = ["card"];
  if (entry.tapped) classes.push("tapped");
  if (entry.sick) classes.push("sick");
  const stats = entry.power !== undefined
    ? ` ${entry.power}/${entry.toughness}` +
      (entry.damage ? ` (${entry.damage} dmg)` : "")
    : "";
  return `<span class="${classes.join(" ")}"` +
    ` title="${entry.tapped ? "tapped" : "untapped"}` +
    `${entry.sick ? ", summoning sick" : ""}">` +
    `${entry.name}${stats}${entry.tapped ? " ⤵" : ""}</span>`;
}

function render() {
  if (!replay) return;
  const s = replay.steps[step];
  document.getElementById("pos").textContent =
    `step ${step + 1}/${replay.steps.length} · turn ${s.turn}`;
  document.getElementById("message").textContent =
    `Turn ${s.turn}: ${s.message}`;
  const stack = document.getElementById("stack");
  if (s.stack.length) {
    stack.style.display = "";
    stack.innerHTML = "<b>Stack:</b> " + s.stack.map(o =>
      `${o.name} (player ${o.controller})`).join(" ← ");
  } else {
    stack.style.display = "none";
  }
  for (let seat = 0; seat < 2; seat++) {
    const p = s.players[seat];
    const pilots = replay.pilots ?? ["?", "?"];
    const hand = seat === 1 && s.observerHand
      ? `<div class="zone"><b>Hand:</b> ${s.observerHand.map(c =>
          `<span class="card">${c}</span>`).join("")}</div>`
      : `<div class="zone"><b>Hand:</b> ${p.handSize} cards</div>`;
    document.getElementById("board" + seat).innerHTML =
      `<h2>Player ${seat} — ${replay.decks[seat]} (${pilots[seat]})` +
      ` · ${p.life} life</h2>` +
      hand +
      `<div class="zone"><b>Lands (${p.lands.length}):</b> ${
        p.lands.map(permanent).join("") || "–"}</div>` +
      `<div class="zone"><b>Creatures:</b> ${
        p.creatures.map(permanent).join("") || "–"}</div>` +
      (p.artifacts.length ? `<div class="zone"><b>Artifacts:</b> ${
        p.artifacts.map(permanent).join("")}</div>` : "") +
      (p.enchantments.length ? `<div class="zone"><b>Enchantments:</b> ${
        p.enchantments.map(n => `<span class="card">${n}</span>`).join("")}</div>` : "") +
      `<div class="zone"><b>Library:</b> ${p.librarySize} ·
        <b>Graveyard:</b> ${p.graveyard}</div>`;
  }
  document.getElementById("prev").disabled = step === 0;
  document.getElementById("next").disabled =
    step === replay.steps.length - 1;
  const url = new URL(location);
  url.searchParams.set("g", document.getElementById("game").value);
  url.searchParams.set("step", step);
  history.replaceState(null, "", url);
}

function jumpToTurn(turn) {
  if (!replay) return;
  const index = replay.steps.findIndex(s => s.turn >= turn);
  step = index === -1 ? replay.steps.length - 1 : index;
  render();
}

async function loadGame(name, initial) {
  const response = await fetch(`replays/${name}.json`, {cache: "no-store"});
  replay = await response.json();
  document.getElementById("meta").textContent =
    `Seed ${replay.seed} · ${replay.decks[0]} (${replay.pilots[0]}) vs ` +
    `${replay.decks[1]} (${replay.pilots[1]}) · winner: player ` +
    `${replay.winner} in ${replay.turns} turns`;
  const params = new URLSearchParams(location.search);
  if (initial && params.get("step") !== null) {
    step = Math.min(Number(params.get("step")), replay.steps.length - 1);
  } else if (initial && params.get("turn") !== null) {
    jumpToTurn(Number(params.get("turn")));
    return;
  } else {
    step = 0;
  }
  render();
}

document.getElementById("prev").onclick = () => { step--; render(); };
document.getElementById("next").onclick = () => { step++; render(); };
document.getElementById("turn").onchange = (e) =>
  jumpToTurn(Number(e.target.value));
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft" && step > 0) { step--; render(); }
  if (e.key === "ArrowRight" && replay && step < replay.steps.length - 1) {
    step++; render();
  }
});

async function listGames() {
  // No directory listing on a static server: keep an index file.
  const response = await fetch("replays/index.json", {cache: "no-store"});
  const names = (await response.json()).replays;
  const select = document.getElementById("game");
  select.innerHTML = names.map(n => `<option>${n}</option>`).join("");
  select.onchange = () => loadGame(select.value, false);
  const params = new URLSearchParams(location.search);
  const wanted = params.get("g");
  if (wanted && names.includes(wanted)) select.value = wanted;
  if (select.value) loadGame(select.value, true);
}
listGames();
</script>
</body>
</html>
