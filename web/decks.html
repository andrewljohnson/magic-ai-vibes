<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decks</title>
<style>
  :root {
    --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --grid: #e7e6e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --grid: #34332f;
    }
  }
  html, body { margin: 0; background: var(--surface); color: var(--ink);
    font: 14px/1.45 -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .deck { border: 1px solid var(--grid); border-radius: 10px; padding: 12px 14px; }
  .deck h2 { font-size: 14px; margin: 0 0 8px; text-transform: capitalize; }
  .deck table { border-collapse: collapse; width: 100%; font-size: 12.5px;
    font-variant-numeric: tabular-nums; }
  .deck td { padding: 2px 4px; border-bottom: 1px solid var(--grid); }
  .deck td.n { text-align: right; width: 2ch; color: var(--ink-2); }
  .deck td.c { text-align: right; color: var(--ink-2); }
  .curve { display: flex; gap: 3px; align-items: flex-end; height: 44px; margin: 8px 0 2px; }
  .curve div { width: 18px; background: #3987e5; border-radius: 3px 3px 0 0; }
  .curve span { font-size: 10px; color: var(--ink-2); text-align: center; display: block; }
  .sub { color: var(--ink-2); font-size: 12px; margin: 2px 0 8px; }
</style>
</head>
<body>
<main>
  <h1>Metagame decks</h1>
  <div class="grid" id="decks">Loading…</div>
</main>
<script src="site-nav.js"></script>
<script>
const TYPES = ["Land", "Creature", "Instant", "Sorcery", "Artifact", "Enchantment"];
async function load() {
  let data;
  try {
    const response = await fetch("decks.json", {cache: "no-store"});
    data = await response.json();
  } catch (error) {
    document.getElementById("decks").textContent =
      "No decks.json yet - run make matchup-matrix && ./build/matchup-matrix";
    return;
  }
  document.getElementById("decks").innerHTML = data.decks.map((deck) => {
    const spells = deck.cards.filter((card) => card.type !== 0);
    const curve = new Map();
    for (const card of spells) {
      curve.set(card.cost, (curve.get(card.cost) ?? 0) + card.count);
    }
    const costs = [...curve.keys()].sort((a, b) => a - b);
    const peak = Math.max(...curve.values(), 1);
    const bars = costs.map((cost) =>
      `<div title="${curve.get(cost)} spells at cost ${cost}"
         style="height:${(38 * curve.get(cost)) / peak + 4}px">
         <span>${cost}</span></div>`).join("");
    const rows = deck.cards.map((card) =>
      `<tr><td class="n">${card.count}</td><td>${card.name}</td>` +
      `<td class="c">${card.type === 1
          ? `${card.power}/${card.toughness}`
          : TYPES[card.type]}${card.type === 0 ? "" : ` · ${card.cost}`}</td></tr>`
    ).join("");
    return `<section class="deck"><h2>${deck.name}</h2>
      <p class="sub">${deck.cards.reduce((a, c) => a + c.count, 0)} cards ·
        ${spells.reduce((a, c) => a + c.count, 0)} spells</p>
      <div class="curve">${bars}</div>
      <table>${rows}</table></section>`;
  }).join("");
}
load();
</script>
</body>
</html>
