<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Penta scouting</title>
<style>
  :root {
    --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --grid: #e7e6e2;
    --good: #1baf7a; --bad: #e34948; --accent: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --grid: #34332f;
      --good: #199e70; --bad: #e66767; --accent: #3987e5;
    }
  }
  html, body { margin: 0; background: var(--surface); color: var(--ink);
    font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .sub { color: var(--ink-2); margin: 0 0 18px; font-size: 13px; }
  .matrix-wrap { overflow-x: auto; margin-bottom: 26px; }
  table { border-collapse: collapse; font-size: 13px;
    font-variant-numeric: tabular-nums; min-width: 780px; }
  th, td { border: 1px solid var(--grid); padding: 5px 10px; text-align: right; }
  th { color: var(--ink-2); font-weight: 550; }
  td:first-child, th:first-child, td:nth-child(2), th:nth-child(2) {
    text-align: left; }
  td.hot { color: var(--good); font-weight: 650; }
  td.cold { color: var(--bad); }
  .card { border: 1px solid var(--grid); border-radius: 10px;
    padding: 14px 18px; margin-bottom: 14px; }
  .card h2 { font-size: 15px; margin: 0 0 2px; }
  .card .win { font-size: 12px; color: var(--ink-2); margin: 0 0 10px; }
  .card h3 { font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--ink-2); margin: 12px 0 3px; }
  .card p { margin: 0; }
  .card ul { margin: 2px 0 0; padding-left: 18px; }
  .card ul li { margin: 1px 0; }
  .card .examples li { font-size: 12px; color: var(--ink-2); }
  .themes { border: 1px solid var(--grid); border-radius: 10px;
    padding: 14px 18px; margin-bottom: 26px; }
  .themes h2 { font-size: 13px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--ink-2); margin: 0 0 6px; }
  .themes ol { margin: 0; padding-left: 20px; }
  .themes li { margin: 4px 0; }
  .method { font-size: 12px; color: var(--ink-2); margin-top: 26px;
    border-top: 1px solid var(--grid); padding-top: 10px; }
</style>
</head>
<body>
<main>
  <h1>Penta scouting</h1>
  <p class="sub" id="sub">Mistake review of the penta deliverable net
    (<code>penta_net.npz</code>, search on) piloting each training deck
    against every deck flown by penta's built-in handcrafted bot &mdash;
    fixed-seed games, per-matchup metrics in the os-digest style.
    Companion to the main bot's <a href="deck-scouting.html"
    style="color:var(--accent)">Scouting</a> page.</p>

  <section class="themes" id="overall" hidden></section>
  <div class="matrix-wrap"><table id="deck-table"></table></div>
  <div class="matrix-wrap"><table id="matrix"></table></div>
  <section class="themes" id="themes"></section>
  <div id="cards"></div>
  <p class="method" id="method"></p>
</main>
<script src="site-nav.js"></script>
<script>
"use strict";
const DECK_ORDER = ["sligh", "ww", "the-deck", "counterburn"];

function fmt(value, suffix) {
  return value === null || value === undefined ? "&mdash;"
    : value + (suffix || "");
}

function renderV2(notes) {
  // scout.py v2 schema: meta + summary (one row per ordered pairing) +
  // games (per-game instrumentation). Prose/themes are not hand-written
  // in this schema; watch-items are derived from the metrics instead.
  const s = notes.summary;
  const wins = s.reduce((a, r) => a + r.wins, 0);
  const games = s.reduce((a, r) => a + r.games, 0);

  const byDeck = new Map();
  for (const r of s) {
    const d = byDeck.get(r.our_deck) ||
      { wins: 0, games: 0, unspent: 0, suicide: 0, atk: [], n: 0 };
    d.wins += r.wins; d.games += r.games;
    d.unspent += r.unspent_turns_per_game * r.games;
    d.suicide += r.suicide_attacks_per_game * r.games;
    if (r.attack_take_rate !== null) d.atk.push(r.attack_take_rate);
    byDeck.set(r.our_deck, d);
  }

  const overall = document.getElementById("overall");
  overall.hidden = false;
  const weak = s.filter(r => r.wins <= 2)
    .sort((a, b) => a.wins - b.wins)
    .map(r => `<li><b>${r.our_deck}</b> vs ${r.their_deck}: ` +
      `${r.wins}/${r.games}` +
      (r.unspent_turns_per_game >= 1
        ? ` &mdash; ${r.unspent_turns_per_game} unspent turns/g` : "") +
      `</li>`).join("");
  overall.innerHTML =
    `<h2>Overall: ${wins}/${games} ` +
    `(${(100 * wins / games).toFixed(1)}%) vs handcrafted</h2>` +
    (weak ? `<ol>${weak}</ol>` : "<p>No pairing at 2/16 or worse.</p>");

  let dt = "<tr><th>Piloting</th><th>Wins</th><th>Win %</th>" +
    "<th>Median attack take</th><th>Unspent turns/g</th>" +
    "<th>Suicide attacks/g</th></tr>";
  const decks = [...byDeck.entries()]
    .sort((a, b) => b[1].wins - a[1].wins);
  for (const [name, d] of decks) {
    const pct = 100 * d.wins / d.games;
    const cls = pct >= 55 ? "hot" : pct <= 35 ? "cold" : "";
    const atk = d.atk.sort((x, y) => x - y)[Math.floor(d.atk.length / 2)];
    dt += `<tr><td>${name}</td>` +
      `<td class="${cls}">${d.wins}/${d.games}</td>` +
      `<td class="${cls}">${pct.toFixed(0)}%</td>` +
      `<td>${fmt(atk)}</td>` +
      `<td>${(d.unspent / d.games).toFixed(1)}</td>` +
      `<td>${(d.suicide / d.games).toFixed(2)}</td></tr>`;
  }
  document.getElementById("deck-table").innerHTML = dt;

  const table = document.getElementById("matrix");
  let html = "<tr><th>Piloting</th><th>vs (handcrafted)</th><th>Wins</th>" +
    "<th>Avg turns</th><th>Attack take</th><th>Block take</th>" +
    "<th>Unspent turns/g</th><th>Suicide atk/g</th>" +
    "<th>Unblocked life lost/g</th><th>Casts into counter mana/g</th></tr>";
  for (const r of s) {
    const winCls = r.wins >= 10 ? "hot" : r.wins <= 5 ? "cold" : "";
    const atkCls = r.attack_take_rate !== null && r.attack_take_rate < 0.5
      ? "cold" : "";
    const unsCls = r.unspent_turns_per_game >= 1 ? "cold" : "";
    const suiCls = r.suicide_attacks_per_game >= 0.5 ? "cold" : "";
    html += `<tr><td>${r.our_deck}</td><td>${r.their_deck}</td>` +
      `<td class="${winCls}">${r.wins}/${r.games}</td>` +
      `<td>${r.avg_turns}</td>` +
      `<td class="${atkCls}">${fmt(r.attack_take_rate)}</td>` +
      `<td>${fmt(r.block_take_rate)}</td>` +
      `<td class="${unsCls}">${r.unspent_turns_per_game}</td>` +
      `<td class="${suiCls}">${r.suicide_attacks_per_game}</td>` +
      `<td>${r.life_lost_unblocked_per_game}</td>` +
      `<td>${r.casts_into_counter_mana_per_game}</td></tr>`;
  }
  table.innerHTML = html;

  const m = notes.meta;
  document.getElementById("method").textContent =
    `Method: ${m.games_per_pair} games per ordered pairing, seeds from ` +
    `${m.seed_base}, alternating seats. Net: ${m.net} (engine ` +
    `${m.engine_version}). Search: topk ${m.search.top_k} / ` +
    `${m.search.playouts} playout / budget ${m.search.budget}. ` +
    `Caveat: search clones carry true hidden state (upstream issue #11). ` +
    `Notes are re-earned after each promotion, not carried forward.`;
}

async function load() {
  const notes = await fetch("penta-scout-notes.json", { cache: "no-store" })
    .then(r => r.json());
  if (notes.summary) { renderV2(notes); return; }

  const table = document.getElementById("matrix");
  let html = "<tr><th>Piloting</th><th>vs (handcrafted)</th><th>Wins</th>" +
    "<th>Avg turns</th><th>Attack take</th><th>Block take</th>" +
    "<th>Unspent turns/g</th><th>Land skips/g</th>" +
    "<th>Casts into counter mana/g</th><th>Counterspells/g</th></tr>";
  for (const row of notes.matchup_summary) {
    const winCls = row.wins >= 3 ? "hot" : row.wins <= 1 ? "cold" : "";
    const atkCls = row.attack_take_rate !== null && row.attack_take_rate < 0.5
      ? "cold" : "";
    const unsCls = row.unspent_turns_per_game >= 1 ? "cold" : "";
    html += `<tr><td>${row.our_deck}</td><td>${row.their_deck}</td>` +
      `<td class="${winCls}">${row.wins}/${row.games}</td>` +
      `<td>${row.avg_turns}</td>` +
      `<td class="${atkCls}">${fmt(row.attack_take_rate)}</td>` +
      `<td>${fmt(row.block_take_rate)}</td>` +
      `<td class="${unsCls}">${row.unspent_turns_per_game}</td>` +
      `<td>${row.land_skips_per_game}</td>` +
      `<td>${row.casts_into_counter_mana_per_game}</td>` +
      `<td>${row.counterspells_per_game}</td></tr>`;
  }
  table.innerHTML = html;

  const themes = document.getElementById("themes");
  themes.innerHTML = "<h2>Highest-value fix themes</h2><ol>" +
    notes.themes.map(t => `<li>${t}</li>`).join("") + "</ol>";

  const cards = document.getElementById("cards");
  for (const key of DECK_ORDER) {
    const note = notes.decks[key];
    if (!note) continue;
    const card = document.createElement("section");
    card.className = "card";
    const matchups = Object.entries(note.matchups || {}).map(
      ([opp, text]) => `<li><b>${opp}:</b> ${text}</li>`).join("");
    const examples = (note.examples || []).map(e => `<li>${e}</li>`).join("");
    card.innerHTML =
      `<h2>${note.deck}</h2>` +
      `<p class="win">${note.record} vs handcrafted across the four opponents</p>` +
      `<h3>How it plays it</h3><p>${note.style}</p>` +
      `<h3>Good habits</h3><p>${note.good}</p>` +
      `<h3>Mistakes &amp; limits</h3><p>${note.mistakes}</p>` +
      `<h3>By matchup</h3><ul>${matchups}</ul>` +
      `<h3>Receipts (seed + turn)</h3><ul class="examples">${examples}</ul>`;
    cards.appendChild(card);
  }

  const m = notes.meta;
  document.getElementById("method").textContent =
    `Method: ${m.games}. Net: ${m.net}. Policy: ${m.policy}. ` +
    `Opponent: ${m.opponent}. Honesty caveat: ${m.caveat}. ` +
    `Generated ${m.generated}; notes are re-earned after each promotion, ` +
    `not carried forward.`;
}
load();
</script>
</body>
</html>
